services:
  backend:
    build: ./backend
    container_name: velure-spa
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      PRODUCT_IMAGES_DIR: /app/uploads/products
    volumes:
      - product_images:/app/uploads/products

  frontend:
    build: ./frontend
    container_name: velure-spa-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  product_images:
